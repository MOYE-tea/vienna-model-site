  <aside class="admin-sidebar">

      <div class="admin-sidebar__brand-sub">ADMIN</div>
    </div>
    <nav class="admin-sidebar__nav">
      <a class="admin-sidebar__link" href="index.html">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
        Dashboard
      </a>
      <a class="admin-sidebar__link" href="bookings.html">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>
        邀約管理
        <span class="admin-sidebar__badge" id="sidebar-pending-badge" style="display:none;"></span>
      </a>
      <a class="admin-sidebar__link" href="calendar.html">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 9h18M8 3v4M16 3v4"/></svg>
        月曆管理
      </a>
      <a class="admin-sidebar__link" href="wardrobe.html">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 4h4l2 3 2-3h4l2 4-3 2v11H7V10L4 8z"/></svg>
        衣櫃管理
      </a>
      <a class="admin-sidebar__link" href="portfolio.html">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="9.5" r="1.5"/><path d="M21 15l-5-5-4 4-3-3-6 6"/></svg>
        作品集管理
      </a>
      <a class="admin-sidebar__link" href="style-gallery.html">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 15 0 010 18M12 3a9 15 0 000 18"/></svg>
        風格參考管理
      </a>
      <a class="admin-sidebar__link" href="photographers.html">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="7" width="18" height="13" rx="2"/><circle cx="12" cy="13.5" r="3.5"/><path d="M9 7l1.5-3h3L15 7"/></svg>
        攝影師紀錄
      </a>
      <a class="admin-sidebar__link is-active" href="settings.html">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.34 1.87l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.7 1.7 0 00-1.87-.34 1.7 1.7 0 00-1 1.55V21a2 2 0 01-4 0v-.09a1.7 1.7 0 00-1-1.55 1.7 1.7 0 00-1.87.34l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.7 1.7 0 00.34-1.87 1.7 1.7 0 00-1.55-1H3a2 2 0 010-4h.09a1.7 1.7 0 001.55-1 1.7 1.7 0 00-.34-1.87l-.06-.06a2 2 0 112.83-2.83l.06.06a1.7 1.7 0 001.87.34H9a1.7 1.7 0 001-1.55V3a2 2 0 014 0v.09a1.7 1.7 0 001 1.55 1.7 1.7 0 001.87-.34l.06-.06a2 2 0 112.83 2.83l-.06.06a1.7 1.7 0 00-.34 1.87V9a1.7 1.7 0 001.55 1H21a2 2 0 010 4h-.09a1.7 1.7 0 00-1.55 1z"/></svg>
        價格與規則
      </a>
    </nav>
    <div class="admin-sidebar__footer">
      <a class="admin-sidebar__view-site" href="/" target="_blank">查看前台網站 ↗</a>
    </div>
  </aside>

  <main class="admin-main">
    <div class="admin-topbar">
      <div><h1>價格與合作規則</h1><div class="admin-topbar__meta">這裡的文字會顯示在前台首頁</div></div>
      <button class="btn" id="save-btn">儲存全部</button>
    </div>

    <div class="admin-content" style="display:flex; flex-direction:column; gap:24px; max-width:760px;">
      <div class="panel">
        <div class="panel__head"><h2>拍攝範圍聲明</h2></div>
        <div style="padding:18px 20px;"><textarea id="disclaimer-text" style="width:100%; min-height:80px; font:inherit; padding:10px; border:1px solid var(--hairline); border-radius:6px;"></textarea></div>
      </div>

      <div class="panel">
        <div class="panel__head"><h2>合作規則文字</h2></div>
        <div style="padding:18px 20px;"><textarea id="rules-text" style="width:100%; min-height:100px; font:inherit; padding:10px; border:1px solid var(--hairline); border-radius:6px;"></textarea></div>
      </div>

      <div class="panel">
        <div class="panel__head"><h2>價目表</h2><button class="btn btn--outline btn--sm" id="add-price-row">+ 新增項目</button></div>
        <div style="padding:18px 20px;" id="pricing-rows"></div>
      </div>

      <div class="panel">
        <div class="panel__head">
          <h2>行事曆同步</h2>
          <button class="btn btn--outline btn--sm" id="test-calendar-btn">測試連線</button>
        </div>
        <div style="padding:18px 20px; display:flex; flex-direction:column; gap:8px;">
          <p style="font-size:13px; color:var(--ink-soft); margin:0;">邀約被「接受」時，會自動把拍攝時間寫進你在 <code>.env</code> 設定的 iCloud 行事曆（<code>ICLOUD_CALENDAR_NAME</code>，預設「Vienna 拍攝」）。這個行事曆需要你自己先在 Calendar App 或 iCloud.com 建立好，不會動到你其他既有的行程。</p>
          <div id="calendar-status" class="placeholder">尚未測試連線</div>
        </div>
      </div>

      <div class="placeholder" id="save-status"></div>
    </div>
  </main>
</div>

<script src="js/api.js"></script>
<script src="js/settings.js"></script>
</body>
</html>
